spring:
  application:
    name: webflux-h2-app
  security:
    auth:
      secret: teste
      issuer: teste
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  r2dbc:
    url: r2dbc:h2:file:///./data/testdb
    username: sa
    password:

  sql:
    init:
      mode: always

  main:
    web-application-type: reactive

server:
  port: 8080

logging:
  level:
    org.springframework.r2dbc: DEBUG
    io.r2dbc.h2: DEBUG