spring:
  application:
    name: webflux-postgres-app

  security:
    auth:
      secret: teste
      issuer: teste

  r2dbc:
    url: r2dbc:postgresql://webflux-postgres:5432/api-performance
#    url: r2dbc:postgresql://localhost:5432/api-performance
    username: user
    password: user@123
    pool:
      initial-size: 100 
      max-size: 500
      max-idle-time: 30000
      validation-query: SELECT 1

  sql:
    init:
      mode: always

  main:
    web-application-type: reactive

server:
  port: 8080
  netty:
    eventloop:
      threads: 16

logging:
  level:
    org.springframework: ERROR
    org.springframework.web: ERROR
    org.hibernate: ERROR
    root: ERROR

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
